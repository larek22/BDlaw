[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-kb-assistant"
version = "0.1.0"
description = "Legal document vector knowledge base assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Vector KB"}]
dependencies = [
    "openai>=1.30.0,<2",
    "qdrant-client>=1.14,<1.16",
    "httpx>=0.27,<0.28",
    "pydantic>=2.7,<3",
    "python-dotenv>=1,<2",
    "pdfminer.six>=20231228",
    "PyMuPDF>=1.24,<2",
    "python-docx>=0.8,<0.9",
    "striprtf>=0.0.26,<0.1",
    "tiktoken>=0.7,<1",
    "PySide6>=6.6,<7",
    "tenacity>=8.4,<9",
    "tqdm>=4.66,<5",
    "orjson>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<8", "ruff>=0.5,<0.6", "black>=24.4,<25"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.isort]
combine-as-imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
pythonpath = ["app"]
